syntax = "proto3";
package atomone.mymodule.v1;

import "gogoproto/gogo.proto";
import "cosmos/base/v1beta1/coin.proto";
import "cosmos_proto/cosmos.proto";
import "cosmos/msg/v1/msg.proto";
import "amino/amino.proto";
import "google/protobuf/timestamp.proto";
import "atomone/mymodule/v1/mymodule.proto";

option go_package = "github.com/atomone-hub/atomone/x/mymodule/types";

// Msg defines the Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;


  // UpdateParams defines a governance operation for updating the x/mymodule
  // module parameters. The authority is defined in the keeper.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
  rpc SendSecureText(MsgSendSecureText) returns (MsgSendSecureTextResponse);
}



// MsgUpdateParams is the Msg/UpdateParams request type.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "atomone/x/mymodule/v1/MsgUpdateParams";

  // authority is the address that controls the module (defaults to x/gov unless
  // overwritten).
  string authority = 1 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];

  // params defines the x/gov parameters to update.
  //
  // NOTE: All parameters must be supplied.
  Params params = 2
      [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
}

// MsgUpdateParamsResponse defines the response structure for executing a
// MsgUpdateParams message.
message MsgUpdateParamsResponse {}

// MsgSend represents a message to send encrypted text from one account to another.
message MsgSendSecureText {
  option (cosmos.msg.v1.signer) = "from";
  option (amino.name)           = "atomone/x/mymodule/v1/MsgSendSecureText";

  option (gogoproto.equal)           = false;
  option (gogoproto.goproto_getters) = false;

  SecureMessage  msg  = 1 [ (gogoproto.nullable) = false, (amino.dont_omitempty) = true ];
  string from = 2 [ (cosmos_proto.scalar) = "cosmos.AddressString" ];
  
}

// MsgSendResponse defines the Msg/Send response type.
message MsgSendSecureTextResponse {}
