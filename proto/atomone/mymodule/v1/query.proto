syntax = "proto3";
package atomone.mymodule.v1;

import "gogoproto/gogo.proto";
import "google/api/annotations.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "atomone/mymodule/v1/mymodule.proto";
import "cosmos/base/v1beta1/coin.proto";
import "amino/amino.proto";
import "cosmos_proto/cosmos.proto";

option go_package = "github.com/atomone-hub/atomone/x/mymodule/types";

// Query defines the gRPC querier service.
service Query {
  // Parameters queries the parameters of the module.
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/atomone/mymodule/v1/params";
  }
  rpc Messages(QueryMessagesRequest) returns (QueryMessagesResponse) {
    option (google.api.http).get = "/atomone/mymodule/v1/messages/{to_address}";
  }
}

// QueryParamsRequest is request type for the Query/Params RPC method.
message QueryParamsRequest {}

// QueryParamsResponse is response type for the Query/Params RPC method.
message QueryParamsResponse {
  // params holds all the parameters of this module.
  Params params = 1 [ (gogoproto.nullable) = false ];
}

// QueryParamsRequest is request type for the Query/Params RPC method.
message QueryMessagesRequest {
  string   to_address                      = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// QueryParamsResponse is response type for the Query/Params RPC method.
message QueryMessagesResponse {
  // params holds all the parameters of this module.
  SecureMessages msgs = 1 [ (gogoproto.nullable) = false ];
}
